[package]
name = "audiobridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
gethostname = "1.1.0"
mdns-sd = "0.21.6"
opus = "0.4.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
